# Lurus newhub STAGE (R6) — test-newhub.lurus.cn → NodePort 30850
server {
    listen 443 ssl http2;
    server_name test-newhub.lurus.cn;
    client_max_body_size 64M;

    ssl_certificate     /etc/ssl/lurus-cn/tls.crt;
    ssl_certificate_key /etc/ssl/lurus-cn/tls.key;

    location / {
        proxy_pass http://127.0.0.1:30850;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 600;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name test-newhub.lurus.cn;
    return 301 https://$host$request_uri;
}
