# Staging namespace for lurus-newhub. Shared with r6-stage manual apply
# (deploy/k8s/r6-stage/namespace.yaml declares the same namespace — kubectl
# apply is idempotent so this is safe).
apiVersion: v1
kind: Namespace
metadata:
  name: lurus-staging
  labels:
    app.kubernetes.io/part-of: lurus
    environment: staging
