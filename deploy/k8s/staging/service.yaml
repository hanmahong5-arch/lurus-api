# Staging service for lurus-newhub. Coexists with the r6-stage
# manual service (same name in same namespace) — GHA `kubectl apply -k`
# is idempotent and updates the existing object in place.
apiVersion: v1
kind: Service
metadata:
  name: lurus-newhub
  namespace: lurus-staging
  labels:
    app: lurus-newhub
    app.kubernetes.io/name: lurus-newhub
    app.kubernetes.io/part-of: lurus
    environment: staging
spec:
  type: ClusterIP
  ports:
    - port: 8850
      targetPort: 3000
      name: http
  selector:
    app: lurus-newhub
    environment: staging
