# HPA for lurus-api: scale 3-3 replicas based on CPU utilization.
# minReplicas=3 (was 1) so the DB-lease leader election (H1.3) always has a
# pool of standbys — a dead leader is replaced by another running replica
# within the lease TTL instead of waiting for a fresh pod to schedule.
# Requires metrics-server to be running in the cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lurus-api
  namespace: lurus-system
  labels:
    app: lurus-api
    app.kubernetes.io/part-of: lurus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lurus-api
  minReplicas: 3
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
