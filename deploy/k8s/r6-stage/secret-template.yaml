# lurus-newhub-secrets — schema only.
# Real values are NOT committed. Apply via:
#   kubectl -n lurus-newhub create secret generic lurus-newhub-secrets \
#     --from-literal=SESSION_SECRET='<set-via-kubectl>' \
#     --from-literal=SQL_DSN='<set-via-kubectl>' \
#     --from-literal=IDENTITY_SERVICE_INTERNAL_KEY='<set-via-kubectl>' \
#     --from-literal=IDENTITY_SESSION_SECRET='<set-via-kubectl>'
# Or seal with sealed-secrets / external-secrets in the future.
apiVersion: v1
kind: Secret
metadata:
  name: lurus-newhub-secrets
  namespace: lurus-newhub
type: Opaque
stringData:
  SESSION_SECRET: "<set-via-kubectl>"
  SQL_DSN: "<set-via-kubectl>"
  IDENTITY_SERVICE_INTERNAL_KEY: "<set-via-kubectl>"
  IDENTITY_SESSION_SECRET: "<set-via-kubectl>"
