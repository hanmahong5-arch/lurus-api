name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout lurus-proto-go
        uses: actions/checkout@v4
        with:
          repository: LurusTech/lurus-proto-go
          path: lurus-proto-go
          fetch-depth: 1

      - name: Checkout zita-sdk-go (pinned, pre-alpha)
        uses: actions/checkout@v4
        with:
          repository: hanmahong5-arch/zita-sdk-go
          # Pre-alpha pin per release_cadence rule. Full sha required;
          # actions/checkout treats short shas as branch/tag names.
          ref: e2611da1e01ef77b8227571204d6780a6364fea3
          path: zita-sdk-go
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # On PRs the image is not pushed; load it into the local daemon so the
          # Trivy step can scan it. load and push are mutually exclusive, so this
          # is the complement of the push condition above.
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Scan image for HIGH/CRITICAL vulnerabilities (Trivy)
        # BLOCKING gate: fails the build on FIXABLE HIGH/CRITICAL CVEs.
        # ignore-unfixed drops CVEs with no upstream fix yet so the gate stays
        # actionable. The 9 CVEs that forced this report-only earlier were cleared
        # 2026-06-01: base-image gnutls via apt upgrade (deb12u7), and Go deps
        # jackc/pgx/v5 -> 5.9.2, otel/sdk family -> 1.43.0, grpc -> 1.79.3.
        # If this goes red a NEW fixable CVE landed: bump the dep/base + rebuild
        # (a deliberate forcing function) — do not silently set exit-code back to 0.
        # On PRs this scans the locally-loaded image; on push/tag it scans the ref
        # just pushed (the login step above authenticates the registry pull).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'
