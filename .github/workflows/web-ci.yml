name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run Playwright e2e against STAGE'
        required: false
        default: 'false'

defaults:
  run:
    working-directory: web

jobs:
  test:
    name: Lint + Typecheck + Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run eslint
      - run: bun run test
      - name: snake_case casing gate
        run: bun run check:casing

  build:
    name: Vite build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bun run build

  security:
    name: bun audit + gitleaks
    runs-on: ubuntu-latest
    # Run security checks independently so they don't block the fast test job
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required by gitleaks for commit-range scanning
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - name: bun audit (blocking — high+ acceptable, critical blocks)
        # 2026-05-26 Wave-Phase H1 cleanup landed: bun audit went from
        # 87 vuln (1 crit, 26 high, 55 mod, 5 low) to 0 crit / 0 high / 7 mod / 0 low
        # via `overrides` block in web/package.json (minimist, lodash, js-cookie,
        # immutable, glob/minimatch/picomatch/brace-expansion, rollup, @remix-run/router,
        # protocol-buffers-schema, prismjs, yaml, geojson-flatten) + axios direct bump
        # 1.12.0 -> 1.16.1 (same major, non-breaking). Major bumps (react 19, vite 8,
        # tailwind 4, eslint 10, typescript 6, react-router 7, lucide-react 1.x,
        # @douyinfe/semi 2.99, marked 18, i18next 26) were deliberately deferred —
        # they break the build/eslint config and need their own focused stories.
        #
        # `--level critical` blocks merges only on new critical advisories. Remaining
        # 7 moderate vulns are transitive in @douyinfe/vite-plugin-semi, ajv, esbuild,
        # js-yaml, mdast-util-to-hast, uuid, vite — all upgrade-pending in upstream.
        # Ratchet to `--level high` once they clear.
        run: bun audit --audit-level critical
      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is optional; set it in repo secrets if you have a
          # commercial license. The action works without it for public repos.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  e2e:
    name: Playwright e2e (STAGE)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true'
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://test-newhub.lurus.cn' }}
          E2E_BRIDGE_TOKEN: ${{ secrets.E2E_BRIDGE_TOKEN }}
          E2E_TENANT_SLUG: ${{ secrets.E2E_TENANT_SLUG || 'default' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
