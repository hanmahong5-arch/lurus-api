name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run Playwright e2e against STAGE'
        required: false
        default: 'false'

defaults:
  run:
    working-directory: web

jobs:
  test:
    name: Lint + Typecheck + Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run eslint
      - run: bun run test
      - name: snake_case casing gate
        run: bun run check:casing

  build:
    name: Vite build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bun run build

  security:
    name: bun audit + gitleaks
    runs-on: ubuntu-latest
    # Run security checks independently so they don't block the fast test job
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required by gitleaks for commit-range scanning
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - name: bun audit (INFORMATIONAL — see doc/uat-handbook.md)
        # 2026-05-26 baseline audit surfaced 87 vulnerabilities (1 critical,
        # 26 high, 55 moderate, 5 low) — all in transitive deps that require
        # a focused dep-bump PR to triage (picomatch via vitest/vite/tailwind,
        # mermaid via @lobehub/ui, immutable, react-router, protocol-buffers-schema).
        # That cleanup is out of Wave-UAT scope.
        #
        # Step is informational until the cleanup PR lands. The CI step still
        # runs so the count is visible in PR logs (and trend is observable);
        # `continue-on-error` keeps it from blocking merges. When the cleanup
        # PR lands, drop the flag and add `--level critical` (later high) to
        # ratchet up.
        continue-on-error: true
        run: bun audit --level low
      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is optional; set it in repo secrets if you have a
          # commercial license. The action works without it for public repos.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  e2e:
    name: Playwright e2e (STAGE)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true'
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://test-newhub.lurus.cn' }}
          E2E_BRIDGE_TOKEN: ${{ secrets.E2E_BRIDGE_TOKEN }}
          E2E_TENANT_SLUG: ${{ secrets.E2E_TENANT_SLUG || 'default' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
