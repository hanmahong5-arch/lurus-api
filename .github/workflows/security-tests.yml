name: Security Tests

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false

jobs:
  security-tests:
    name: Security Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The repo's go.mod has `replace` directives pointing at
      # ../shared/lurus-proto-go and ../shared/zita-sdk-go. `actions/checkout`
      # refuses paths outside GITHUB_WORKSPACE, so check the sibling repos
      # into the workspace then move them into the parent ../shared/ dir.
      - name: Check out lurus-proto-go (sibling dep)
        uses: actions/checkout@v4
        with:
          repository: LurusTech/lurus-proto-go
          path: _sibling/lurus-proto-go
          fetch-depth: 1

      - name: Check out zita-sdk-go (pinned sibling dep)
        uses: actions/checkout@v4
        with:
          repository: hanmahong5-arch/zita-sdk-go
          ref: e2611da1e01ef77b8227571204d6780a6364fea3
          path: _sibling/zita-sdk-go
          fetch-depth: 1

      - name: Relocate sibling repos to ../shared
        run: |
          mkdir -p ../shared
          mv _sibling/lurus-proto-go ../shared/lurus-proto-go
          mv _sibling/zita-sdk-go ../shared/zita-sdk-go
          rmdir _sibling

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run Security Tests
        run: |
          echo "=== Running Security Test Suite ==="
          go test -v ./internal/adapter/... -run Security -count=1 -timeout=5m
          go test -v ./internal/adapter/repo/... -run Tenant -count=1 -timeout=5m
          go test -v ./internal/adapter/handler/... -run Security -count=1 -timeout=5m
          go test -v ./internal/adapter/middleware/... -run "JWKS|Zitadel" -count=1 -timeout=5m

      - name: Run OAuth Security Tests
        run: |
          echo "=== Running OAuth Security Tests ==="
          go test -v ./internal/adapter/handler/... -run "PKCE|IDToken|TenantSlug|RedirectURL|OAuthState" -count=1

      - name: Summary
        if: always()
        run: |
          echo "## Security Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Security regression tests completed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Categories" >> $GITHUB_STEP_SUMMARY
          echo "- Tenant Isolation Tests" >> $GITHUB_STEP_SUMMARY
          echo "- JWKS Key Rotation Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Rate Limiting Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Input Sanitization Tests (SQL Injection, XSS)" >> $GITHUB_STEP_SUMMARY
          echo "- Auth Bypass Tests (JWT validation)" >> $GITHUB_STEP_SUMMARY
          echo "- OAuth/PKCE Security Tests" >> $GITHUB_STEP_SUMMARY
